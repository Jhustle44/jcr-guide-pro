mutation CreateBookmark($guideId: UUID!) @auth(level: USER) {
  userBookmark_insert(data: { userId_expr: "auth.uid", guideId: $guideId })
}

mutation UpsertBookmark($id: UUID!, $guideId: UUID!) @auth(level: USER) {
  userBookmark_upsert(data: { id: $id, userId_expr: "auth.uid", guideId: $guideId })
}

mutation DeleteBookmark($id: UUID!) @auth(level: USER) {
  userBookmark_delete(key: { id: $id })
}

mutation UpdateBookmark($id: UUID!, $guideId: UUID!) @auth(level: USER) {
  userBookmark_update(key: { id: $id }, data: { guideId: $guideId })
}

query GetMyBookmarks @auth(level: USER) {
  userBookmarks(where: { userId: { eq_expr: "auth.uid" } }) { guide { title } }
}

query GetBookmark($id: UUID!) @auth(level: USER) {
  userBookmark(key: { id: $id }) { userId }
}