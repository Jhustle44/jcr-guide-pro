mutation CreateGuide($title: String!, $difficulty: String!, $time: Int!) @auth(level: PUBLIC, insecureReason: "Guides are public knowledge.") {
  guide_insert(data: { title: $title, difficultyLevel: $difficulty, estimatedTimeMinutes: $time })
}

mutation UpsertGuide($id: UUID!, $title: String!, $difficulty: String!, $time: Int!) @auth(level: PUBLIC, insecureReason: "Guides are public knowledge.") {
  guide_upsert(data: { id: $id, title: $title, difficultyLevel: $difficulty, estimatedTimeMinutes: $time })
}

mutation DeleteGuide($id: UUID!) @auth(level: PUBLIC, insecureReason: "Publicly maintained guides.") {
  guide_delete(key: { id: $id })
}

mutation UpdateGuide($id: UUID!, $time: Int!) @auth(level: PUBLIC, insecureReason: "Guides are public knowledge.") {
  guide_update(key: { id: $id }, data: { estimatedTimeMinutes: $time })
}

query GetGuide($id: UUID!) @auth(level: PUBLIC, insecureReason: "Guides are public knowledge.") {
  guide(id: $id) { title }
}

query ListGuides @auth(level: PUBLIC, insecureReason: "Guides are public knowledge.") {
  guides { title }
}

